name: Real-data checks

# Deliberately NOT on pull_request. Everything here touches real production
# data, so the credentials must never be reachable from a workflow an outside
# contributor can influence. Schedule plus manual dispatch keeps it to code
# that is already on main.
#
# What this is NOT any more: the gate. The tests that check code are in ci.yml
# and run on every pull request against the generated corpus, with no secrets.
# Two things are left here, and both are about production itself rather than
# about the code:
#
#   1. The profile drift check. tests/production_profile.json is a measurement
#      of production, and a measurement taken once is an assumption again by
#      the following month. This re-measures and fails when production holds a
#      shape the corpus cannot produce - a new categorical value, a column
#      that started holding nulls, a range that moved, a new table. That is
#      what keeps the corpus a measurement instead of a belief.
#
#   2. The tests whose subject is a live writer, not a code path: is the
#      reaper still requeueing, is the batch poller still resuming, did the
#      comp extractor write a sane figure. Each one says in its own docstring
#      why the corpus cannot falsify it.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: integration
  cancel-in-progress: false

jobs:
  profile-drift:
    runs-on: ubuntu-latest
    if: github.repository == 'kensac/job-scripts'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # A check that cannot run fails. Skipping here was green every night
      # while nothing was measured, which reads exactly like "production
      # still matches".
      - name: Check credential is configured
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_READONLY_DATABASE_URL }}
        run: |
          if [ -z "$PRODUCTION_DATABASE_URL" ]; then
            echo "::error::Repository secret PRODUCTION_READONLY_DATABASE_URL is not set, so the profile drift check measured nothing. Set it to a read-only production DSN."
            exit 1
          fi

      # SELECT only. The script opens its transaction with
      # `SET default_transaction_read_only = on`, so a bug in it cannot write.
      - name: Production still matches the measured profile
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_READONLY_DATABASE_URL }}
          PYTHONPATH: src
        run: python scripts/measure_profile.py --check

  real-data:
    runs-on: ubuntu-latest
    if: github.repository == 'kensac/job-scripts'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # A check that cannot run fails. The integration tests skip themselves
      # on a database that is not a synced copy (tests/conftest.py reads the
      # testdb_synced_at stamp), so without this the job reported "13
      # skipped" in green every night and checked nothing.
      - name: Check the database holds a synced copy of production
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          PYTHONPATH: src
        run: |
          if [ -z "$TEST_DATABASE_URL" ]; then
            echo "::error::Repository secret TEST_DATABASE_URL is not set, so no real-data test ran."
            exit 1
          fi
          python - <<'EOF'
          import os, sys
          import psycopg
          try:
              with psycopg.connect(os.environ["TEST_DATABASE_URL"]) as conn:
                  row = conn.execute(
                      "SELECT value FROM app_config WHERE key = 'testdb_synced_at'"
                  ).fetchone()
          except psycopg.Error as exc:
              print(f"::error::Could not read TEST_DATABASE_URL: {type(exc).__name__}")
              sys.exit(1)
          if not row:
              print(
                  "::error::The database behind secret TEST_DATABASE_URL holds no synced "
                  "copy of production (no testdb_synced_at stamp), so every integration "
                  "test would skip. Refresh it with scripts/sync_testdb.py."
              )
              sys.exit(1)
          print(f"synced copy from {row[0]}")
          EOF

      - name: Run the tests that need real data
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
          JOBTRACKER_SERVICE_TOKEN: ci
          PYTHONPATH: src
        run: pytest -q -m integration tests
