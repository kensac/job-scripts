name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # A push by the workflow token starts no workflow, so the auto-fix commit
  # below gets no run of its own. It does not need one: the run that pushes it
  # takes its revision afterwards and judges what it pushed. Kept for running
  # the workflow by hand.
  workflow_dispatch:

# Pull requests run without production credentials. Forks receive only a
# read-only workflow token; neither collection nor test lanes may read secrets.
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      corrected: ${{ steps.autofix.outputs.changed }}
      revision: ${{ steps.revision.outputs.sha }}
    permissions:
      contents: write
      actions: write
    # No database here. The schema export reads the app's routes, not its
    # tables: exported against a DSN pointing at a closed port it produces a
    # file identical to the committed one, byte for byte. Booting Postgres
    # for it cost the gate about 14 s (7.7 s pulling the image, 5.9 s waiting
    # on a health check), and every other job waits on the gate. Migrations
    # are still applied and checked for drift in `static`, on a real
    # database, and tests/test_openapi_current.py still compares the
    # committed schema against the live routes.
    #
    # The DSN still has to be SET: core/pool.py reads DATABASE_URL at import
    # and raises KeyError without it. Port 1 refuses the connection, the pool
    # logs that it could not connect, and the export finishes anyway because
    # it never asks the pool for anything.
    env:
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/no_database_here
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Test the event's exact revision; fixes push explicitly to its branch.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # Mechanical fixes are committed, not reported. Lint autofixes,
      # formatting and the generated openapi.json are the three things a
      # human only ever fixes by running a command, so the run runs it: when
      # anything changed, the fix is pushed as its own commit, this workflow is
      # dispatched on that commit, and this run stops here green. The
      # dispatched run is the one that judges the branch; a fix that leaves a
      # real failure behind fails there, on a commit that already carries the
      # mechanical corrections. Only the pull request's own run fixes, and only
      # for branches in this repository: the dispatched run judges and never
      # fixes, so a fix that does not converge (a schema that differs run to
      # run) shows up as one failing check rather than an unbounded chain of
      # green runs each pushing a commit; a fork's token cannot push, and its
      # run falls through to the checks below.
      - name: Auto-fix lint, format and schema
        id: autofix
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          JOBTRACKER_SERVICE_TOKEN: ci
          APP_ENCRYPTION_KEY: ci
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
          # A push authenticated by the workflow token starts no ordinary run:
          # GitHub gates it as action_required so a workflow cannot trigger
          # itself forever. The gated run sits on the pull request's new head,
          # which is why the request shows no verdict even though this run
          # produced one. A token belonging to a person or an app does not
          # have that restriction, so with AUTOFIX_TOKEN set the pushed commit
          # gets a real run whose checks land on the request. Without it the
          # verdict below is still correct, it is just attached to the commit
          # this run started from.
          AUTOFIX_TOKEN: ${{ secrets.AUTOFIX_TOKEN }}
        run: |
          ruff check --fix src tests || true
          ruff format src tests
          # No migration first, and no database at all: the export reads
          # the route table off the app object. The ordering this replaces
          # existed because importing the app used to run legacy
          # IF NOT EXISTS DDL in core.store.
          schema_status=0
          schema_file=$(mktemp)
          if python -m api.export_schema > "$schema_file"; then
            mv "$schema_file" openapi.json
          else
            schema_status=1
          fi
          # Preserve lint and format fixes even when schema generation fails.
          # The steps below check migrations and the schema independently, on
          # this same run and on the commit this one pushes.
          if git diff --quiet -- src tests openapi.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit "$schema_status"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src tests openapi.json
          git commit -m "chore: auto-fix lint, format and schema"
          if [ -n "$AUTOFIX_TOKEN" ]; then
            git push "https://x-access-token:$AUTOFIX_TOKEN@github.com/$GITHUB_REPOSITORY" \
              "HEAD:$HEAD_BRANCH"
          else
            git push origin "HEAD:$HEAD_BRANCH"
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Pushed mechanical fixes as a new commit; this run judges it"
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Lint
        run: ruff check src tests
      - name: Format check
        run: ruff format --check src tests
  # Everything the gate proved was not needed before the tests can start.
  # It ran inside prepare, and the lanes waited about twenty seconds for
  # checks none of them consume: the manifest below is read by `check` at
  # the end, not by a lane. Now it runs beside them.
  static:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        # pgvector, not plain postgres: migrations CREATE EXTENSION vector, so a
        # base image without it fails the whole suite at conftest import.
        # -trixie is load-bearing. The default pg18 tag is bookworm (glibc 2.36)
        # and prod's cluster was initialised under trixie (glibc 2.41); mixing
        # them emits collation-version mismatches, which is silent text-index
        # corruption rather than a loud failure.
        image: pgvector/pgvector:pg18-trixie@sha256:78bf48b801e792f99e3ac62b5036fd3876e9be48afda16c1e331af1c75ceb2ff
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: jobtracker_ci
        ports:
          - 5432:5432
        # Postgres is ready about a second after it starts; a 5 s interval
        # with no start period meant the first probe ran too early and the
        # job waited for the second, 5.9 s measured. Probe sooner and more
        # often, with the same total patience.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ci" --health-interval 2s
          --health-start-period 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/jobtracker_ci
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.gate.outputs.revision }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Type check
        run: pyright
      - name: Import contract
        run: lint-imports
      - name: Compile all sources
        run: python -m compileall -q src
      - name: Migrations apply cleanly
        run: python -m alembic upgrade head
      - name: Collect the complete test manifest
        env:
          TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/jobtracker_ci
          JOBTRACKER_SERVICE_TOKEN: ci
        run: |
          export TEST_REVISION=$(git rev-parse HEAD)
          export APP_ENCRYPTION_KEY=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          node --test tests/extension/*.test.cjs
          python -m pytest -p tests.ci_suite --collect-only -q tests --test-report=manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-manifest
          path: manifest.json
          if-no-files-found: error
      - name: Models match migrations (autogen must be empty)
        run: |
          python -m alembic revision --autogenerate -m ci_drift_check
          f=$(ls alembic/versions/*ci_drift_check*.py)
          if grep -qE "op\.(add|drop|create|alter)" "$f"; then
            echo "::error::ORM models drifted from migrations - generate a real migration"; cat "$f"; exit 1
          fi


  tests:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        lane: [shard-0, shard-1, shard-2, corpus]
    uses: ./.github/workflows/test-run.yml
    with:
      lane: ${{ matrix.lane }}
      shards: 3
      revision: ${{ needs.gate.outputs.revision }}

  # Preserve the required check name. Every lane must pass and account for
  # the complete collection before this gate can be green.
  #
  # There used to be an exemption here: when the auto-fix step pushed a
  # commit, the test lanes were skipped and this gate passed on preparation
  # alone, because a dispatched run was expected to judge the new commit. That
  # run's checks never attach to the pull request, so the exemption was a
  # green check that had judged nothing. The fix is not a better token: the
  # run that pushes the commit now takes its revision afterwards and judges
  # exactly what it pushed.
  check:
    if: always()
    needs: [gate, static, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require successful preparation and execution
        env:
          GATE_RESULT: ${{ needs.gate.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          CORRECTED: ${{ needs.gate.outputs.corrected }}
        run: |
          test "$GATE_RESULT" = success
          # An auto-fix push deliberately skips the static checks and the
          # lanes: the run it dispatches on the pushed commit is the one that
          # judges them. Requiring them here would fail every branch that
          # needed a mechanical fix.
          if [ "$CORRECTED" != true ]; then
            test "$STATIC_RESULT" = success
            test "$TEST_RESULT" = success
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.gate.outputs.corrected != 'true'
        with:
          ref: ${{ needs.gate.outputs.revision }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: needs.gate.outputs.corrected != 'true'
        with:
          name: test-manifest
          path: collection
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: needs.gate.outputs.corrected != 'true'
        with:
          pattern: timings-*
          path: measurements
      - name: Verify every collected test executed exactly once
        if: needs.gate.outputs.corrected != 'true'
        run: python tools/test_performance.py measurements --shards=3 --manifest=collection/manifest.json | tee "$GITHUB_STEP_SUMMARY"
