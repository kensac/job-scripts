name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    # Skip only the redundant re-run triggered by our own openapi auto-commit
    # push; never skip via commit-message markers — [skip ci] in the commit
    # body survives into squash-merge messages and silently kills ALL workflow
    # runs for the merge push on main.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      postgres:
        # pgvector, not plain postgres: migrations CREATE EXTENSION vector, so a
        # base image without it fails the whole suite at conftest import.
        # -trixie is load-bearing. The default pg18 tag is bookworm (glibc 2.36)
        # and prod's cluster was initialised under trixie (glibc 2.41); mixing
        # them emits collation-version mismatches, which is silent text-index
        # corruption rather than a loud failure.
        image: pgvector/pgvector:pg18-trixie@sha256:78bf48b801e792f99e3ac62b5036fd3876e9be48afda16c1e331af1c75ceb2ff
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: jobtracker_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/jobtracker_ci
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Check out the PR branch itself (not the merge ref) so the
          # regenerated schema can be committed back to it.
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint
        run: |
          pip install -r requirements-dev.txt
          ruff check src tests
      - name: Format check
        run: ruff format --check src tests
      - name: Type check
        run: pyright
      - name: Compile all sources
        run: python -m compileall -q src
      - name: Migrations apply cleanly
        run: python -m alembic upgrade head
      # The WHOLE suite, with no marker filter. Three populations run here:
      # the hermetic tests on a truncated database, the `corpus` tests against
      # the generated catalog in tests/corpus.py - built from the committed
      # measurement of production, so it needs no credential - and the
      # `integration` tests, which skip because this database is not a copy of
      # production and must never be one.
      #
      # NOTHING IN THIS FILE MAY READ A SECRET. That is the whole point: this
      # workflow runs on pull_request, so anything it can reach is reachable
      # from a branch an outside contributor can push.
      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/jobtracker_ci
          JOBTRACKER_SERVICE_TOKEN: ci
        run: |
          export APP_ENCRYPTION_KEY=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          pip install -r requirements-dev.txt
          pytest -q tests
      - name: Models match migrations (autogen must be empty)
        run: |
          python -m alembic revision --autogenerate -m ci_drift_check
          f=$(ls alembic/versions/*ci_drift_check*.py)
          if grep -qE "op\.(add|drop|create|alter)" "$f"; then
            echo "::error::ORM models drifted from migrations - generate a real migration"; cat "$f"; exit 1
          fi
      - name: Regenerate openapi.json (auto-commit if stale)
        env:
          JOBTRACKER_SERVICE_TOKEN: ci
          APP_ENCRYPTION_KEY: ci
        run: |
          python -m api.export_schema > openapi.json
          if ! git diff --quiet -- openapi.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add openapi.json
            git commit -m "chore: regenerate openapi.json"
            git push
            echo "::notice::openapi.json was stale - regenerated and committed"
          fi
