name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Kept for running the workflow by hand. The auto-fix below does not use it:
  # a commit it pushes gets its run from the author's next push, or from
  # AUTOFIX_TOKEN when that secret is set.
  workflow_dispatch:

# Pull requests run without production credentials. Forks receive only a
# read-only workflow token; neither collection nor test lanes may read secrets.
jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # No database here. The schema export reads the app's routes, not its
    # tables: exported against a DSN pointing at a closed port it produces a
    # file identical to the committed one, byte for byte. Booting Postgres
    # for it cost the gate about 14 s (7.7 s pulling the image, 5.9 s waiting
    # on a health check), and every other job waits on the gate. Migrations
    # are still applied and checked for drift in `static`, on a real
    # database, and tests/test_openapi_current.py still compares the
    # committed schema against the live routes.
    # api/export_schema.py points the pool at a closed port itself.
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The branch head, not the merge result: a fix has to be pushed back
          # to a real branch. Every other job judges github.sha, which on a
          # pull request is the head merged into main.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # Mechanical fixes are committed, not reported. Lint autofixes,
      # formatting and the generated openapi.json are the three things a
      # human only ever fixes by running a command, so the run runs it and
      # pushes the result as its own commit. Then it FAILS, and everything
      # below is skipped: this run started from the commit before the fix, so
      # any verdict it gave would sit on a commit that is no longer the head,
      # about a tree that is not what the branch holds. The pushed commit is
      # judged by a run of its own. Only the pull request's own run fixes, and
      # only for branches in this repository; a fork's token cannot push, and
      # its run falls through to the checks below.
      - name: Auto-fix lint, format and schema
        id: autofix
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          JOBTRACKER_SERVICE_TOKEN: ci
          APP_ENCRYPTION_KEY: ci
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
          # A push authenticated by the workflow token starts no ordinary run:
          # GitHub gates it as action_required so a workflow cannot trigger
          # itself forever. A token belonging to a person or an app does not
          # have that restriction, so with AUTOFIX_TOKEN set the pushed commit
          # gets a real run whose checks land on the request. Without it the
          # author's next push is what starts that run.
          AUTOFIX_TOKEN: ${{ secrets.AUTOFIX_TOKEN }}
        run: |
          ruff check --fix src tests || true
          ruff format src tests
          # No migration first, and no database at all: the export reads
          # the route table off the app object. The ordering this replaces
          # existed because importing the app used to run legacy
          # IF NOT EXISTS DDL in core.store.
          schema_status=0
          schema_file=$(mktemp)
          if python -m api.export_schema > "$schema_file"; then
            mv "$schema_file" openapi.json
          else
            schema_status=1
          fi
          # Preserve lint and format fixes even when schema generation fails.
          # The pushed commit's own run checks the schema again.
          if git diff --quiet -- src tests openapi.json; then
            exit "$schema_status"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src tests openapi.json
          git commit -m "chore: auto-fix lint, format and schema"
          if [ -n "$AUTOFIX_TOKEN" ]; then
            git push "https://x-access-token:$AUTOFIX_TOKEN@github.com/$GITHUB_REPOSITORY" \
              "HEAD:$HEAD_BRANCH"
          else
            git push origin "HEAD:$HEAD_BRANCH"
          fi
          fixed=$(git rev-parse --short HEAD)
          if [ -n "$AUTOFIX_TOKEN" ]; then
            next="Its own run has started; that run is the verdict."
          else
            next="Nothing has judged it yet. Pull it and push again, for example: git pull && git commit --allow-empty -m 'ci: judge the auto-fix' && git push"
          fi
          echo "::error::Auto-fix pushed $fixed (lint, format or openapi.json). This run started from the commit before it, so it judges nothing. $next"
          exit 1
      - name: Lint
        run: ruff check src tests
      - name: Format check
        run: ruff format --check src tests
  # Everything the gate proved was not needed before the tests can start.
  # It ran inside prepare, and the lanes waited about twenty seconds for
  # checks none of them consume: the manifest below is read by `check` at
  # the end, not by a lane. Now it runs beside them.
  static:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/jobtracker_ci
      PYTHONPATH: src
    steps:
      # Postgres starts in the background so its image pull overlaps the
      # checkout and the dependency sync below. As a `services:` block the
      # runner pulled and health-checked it before the job's first step,
      # with nothing to overlap: 12-14 s of a 45 s lane, measured, of which
      # 7.7 s was the pull. Here that time is spent while the job does its
      # other setup, and the wait below is what is left of it.
      - name: Start Postgres in the background
        run: |
          nohup docker run --rm -d --name pg -p 5432:5432 \
            -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=jobtracker_ci \
            pgvector/pgvector:pg18-trixie@sha256:78bf48b801e792f99e3ac62b5036fd3876e9be48afda16c1e331af1c75ceb2ff >/dev/null 2>&1 &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Type check
        run: pyright
      # Whatever is left of the pull and the boot after the setup above.
      # A container that never arrives fails here with its own logs rather
      # than as a connection refused inside a test.
      - name: Wait for Postgres
        run: |
          for _ in $(seq 1 90); do
            if docker exec pg pg_isready -h 127.0.0.1 -U ci >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::Postgres never became ready"
          docker logs pg 2>&1 | tail -50 || true
          exit 1
      - name: Import contract
        run: lint-imports
      - name: Compile all sources
        run: python -m compileall -q src
      # The same targets `make check` runs, so the two cannot drift apart.
      # On a pull request this tree is the branch merged into main, which is
      # where two migration heads from parallel branches first exist.
      - name: Migrations apply cleanly and match the models
        env:
          TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/jobtracker_ci
        run: make migrations-check
      - name: No em dashes
        run: make prose
      - name: Collect the complete test manifest
        env:
          TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/jobtracker_ci
          JOBTRACKER_SERVICE_TOKEN: ci
        run: |
          export TEST_REVISION=$(git rev-parse HEAD)
          export APP_ENCRYPTION_KEY=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          python -m pytest -p tests.ci_suite --collect-only -q tests --test-report=manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-manifest
          path: manifest.json
          if-no-files-found: error

  extension:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
        working-directory: extension
      - run: npm run typecheck
        working-directory: extension
      - run: npm run zip
        working-directory: extension
      - run: npm test
        working-directory: extension
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: job-tracker-apply
          path: extension/.output/*.zip
          if-no-files-found: error
          include-hidden-files: true

  tests:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        lane: [shard-0, shard-1, shard-2, shard-3, shard-4, shard-5, corpus]
    uses: ./.github/workflows/test-run.yml
    with:
      lane: ${{ matrix.lane }}
      # Six, because the lane is no longer mostly pytest. A three-way shard
      # ran about 26 s of tests inside a job that took 45-60 s; the rest is
      # the runner starting, the image pulling and the database coming up,
      # and that part does not shrink by sharding. Halving the tests per
      # lane takes the pytest step to roughly 13 s and the job to about 30 s,
      # at the cost of three more container boots.
      shards: 6
      revision: ${{ github.sha }}

  # Preserve the required check name. Every job must pass and the lanes must
  # account for the complete collection before this gate can be green. There
  # is no exemption for an auto-fix push: that run fails in `gate`, so a green
  # `check` only ever comes from a run that judged the commit it started from.
  check:
    if: always()
    needs: [gate, static, extension, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require successful preparation and execution
        env:
          GATE_RESULT: ${{ needs.gate.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          EXTENSION_RESULT: ${{ needs.extension.result }}
          TEST_RESULT: ${{ needs.tests.result }}
        run: |
          test "$GATE_RESULT" = success
          test "$STATIC_RESULT" = success
          test "$EXTENSION_RESULT" = success
          test "$TEST_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: test-manifest
          path: collection
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: timings-*
          path: measurements
      - name: Verify every collected test executed exactly once
        run: python tools/test_performance.py measurements --shards=6 --manifest=collection/manifest.json | tee "$GITHUB_STEP_SUMMARY"
