name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    # Skip only the redundant re-run triggered by our own openapi auto-commit
    # push; never skip via commit-message markers — [skip ci] in the commit
    # body survives into squash-merge messages and silently kills ALL workflow
    # runs for the merge push on main.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: jobtracker_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/jobtracker_ci
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Check out the PR branch itself (not the merge ref) so the
          # regenerated schema can be committed back to it.
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Compile all sources
        run: python -m compileall -q src
      - name: Migrations apply cleanly
        run: python -m alembic upgrade head
      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/jobtracker_ci
          JOBTRACKER_SERVICE_TOKEN: ci
        run: |
          export APP_ENCRYPTION_KEY=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          pip install -r requirements-dev.txt
          pytest -q tests
      - name: Models match migrations (autogen must be empty)
        run: |
          python -m alembic revision --autogenerate -m ci_drift_check
          f=$(ls alembic/versions/*ci_drift_check*.py)
          if grep -qE "op\.(add|drop|create|alter)" "$f"; then
            echo "::error::ORM models drifted from migrations - generate a real migration"; cat "$f"; exit 1
          fi
      - name: Regenerate openapi.json (auto-commit if stale)
        env:
          JOBTRACKER_SERVICE_TOKEN: ci
          APP_ENCRYPTION_KEY: ci
        run: |
          python -m api.export_schema > openapi.json
          if ! git diff --quiet -- openapi.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add openapi.json
            git commit -m "chore: regenerate openapi.json"
            git push
            echo "::notice::openapi.json was stale - regenerated and committed"
          fi
