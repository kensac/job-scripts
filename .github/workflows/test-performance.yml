name: Test performance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        lane: [serial, profile, shard-0, shard-1, shard-2, corpus]
        repetition: [1, 2]
        exclude:
          - lane: profile
            repetition: 2
    uses: ./.github/workflows/test-run.yml
    with:
      lane: ${{ matrix.lane }}
      repetition: ${{ matrix.repetition }}
      shards: 3
      revision: ${{ github.event.pull_request.head.sha || github.sha }}

  compare:
    if: always()
    needs: benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: timings-*
          path: measurements
      - name: Verify coverage and compare timings
        run: python tools/test_performance.py measurements --repetitions=2 --shards=3 | tee "$GITHUB_STEP_SUMMARY"
