name: Generate snapshot schema
on:
  pull_request:
    paths:
      - src/api/orm/ai.py
      - .github/workflows/generate-snapshot-schema.yml
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: jobtracker_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/jobtracker_ci
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - run: uv run alembic revision --autogenerate -m 'external request snapshot references'
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-schema
          path: alembic/versions/*external_request_snapshot_references.py
