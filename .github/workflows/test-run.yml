name: Python test lane

on:
  workflow_call:
    inputs:
      lane:
        type: string
        required: true
      revision:
        type: string
        required: true
      shards:
        type: number
        required: true
      repetition:
        type: number
        default: 1

permissions:
  contents: read

jobs:
  run:
    name: ${{ inputs.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie@sha256:78bf48b801e792f99e3ac62b5036fd3876e9be48afda16c1e331af1c75ceb2ff
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: jobtracker_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ci" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/jobtracker_ci
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/jobtracker_ci
      JOBTRACKER_SERVICE_TOKEN: ci
      PYTHONPATH: src
      TEST_SHARDS: ${{ inputs.shards }}
      TEST_LANE: ${{ inputs.lane }}
      TEST_REPETITION: ${{ inputs.repetition }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.revision }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # No `alembic upgrade head` here: conftest provisions the database it
      # is handed, so the step migrated an empty database that pytest then
      # found already at head. Two to three seconds a lane, four lanes.
      - name: Measure tests
        run: |
          mkdir -p results
          export TEST_REVISION=$(git rev-parse HEAD)
          export APP_ENCRYPTION_KEY=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          args=(-p tests.ci_suite -q tests --durations=25 --test-report=results/timing.json --junitxml=results/junit.xml)
          case "$TEST_LANE" in
            serial|profile) ;;
            corpus) args+=(-m corpus) ;;
            # -n auto: four vCPUs on a public repo's runner, and the suite
            # waits on Postgres far more than it computes, so the workers
            # overlap each other's waiting. Each gets its own database
            # (tests/conftest.py), which is what makes this safe at all.
            shard-*) args+=(-n auto -m 'not corpus' --shard-count="$TEST_SHARDS" --shard-index="${TEST_LANE#shard-}") ;;
            *) echo "Unknown test lane: $TEST_LANE"; exit 1 ;;
          esac
          if [ "$TEST_LANE" = profile ]; then
            python -m cProfile -o results/profile.pstats -m pytest "${args[@]}"
          else
            python -m pytest "${args[@]}"
          fi
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: timings-${{ inputs.lane }}-${{ inputs.repetition }}
          path: results/
          if-no-files-found: error
