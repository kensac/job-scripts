name: Python test lane

on:
  workflow_call:
    inputs:
      lane:
        type: string
        required: true
      revision:
        type: string
        required: true
      shards:
        type: number
        required: true
      repetition:
        type: number
        default: 1

permissions:
  contents: read

jobs:
  run:
    name: ${{ inputs.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/jobtracker_ci
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/jobtracker_ci
      JOBTRACKER_SERVICE_TOKEN: ci
      PYTHONPATH: src
      TEST_SHARDS: ${{ inputs.shards }}
      TEST_LANE: ${{ inputs.lane }}
      TEST_REPETITION: ${{ inputs.repetition }}
    steps:
      # Postgres starts in the background so its image pull overlaps the
      # checkout and the dependency sync below. As a `services:` block the
      # runner pulled and health-checked it before the job's first step,
      # with nothing to overlap: 12-14 s of a 45 s lane, measured, of which
      # 7.7 s was the pull. Here that time is spent while the job does its
      # other setup, and the wait below is what is left of it.
      - name: Start Postgres in the background
        run: |
          nohup docker run --rm -d --name pg -p 5432:5432 \
            -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=jobtracker_ci \
            pgvector/pgvector:pg18-trixie@sha256:78bf48b801e792f99e3ac62b5036fd3876e9be48afda16c1e331af1c75ceb2ff >/dev/null 2>&1 &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.revision }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      # No `alembic upgrade head` here: conftest provisions the database it
      # is handed, so the step migrated an empty database that pytest then
      # found already at head. Two to three seconds a lane, four lanes.
      # Whatever is left of the pull and the boot after the setup above.
      # A container that never arrives fails here with its own logs rather
      # than as a connection refused inside a test.
      - name: Wait for Postgres
        run: |
          for _ in $(seq 1 90); do
            if docker exec pg pg_isready -h 127.0.0.1 -U ci >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::Postgres never became ready"
          docker logs pg 2>&1 | tail -50 || true
          exit 1
      - name: Measure tests
        run: |
          mkdir -p results
          export TEST_REVISION=$(git rev-parse HEAD)
          export APP_ENCRYPTION_KEY=$(python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          args=(-p tests.ci_suite -q tests --durations=25 --test-report=results/timing.json --junitxml=results/junit.xml)
          case "$TEST_LANE" in
            serial|profile) ;;
            corpus) args+=(-m corpus) ;;
            # No -n here. Measured on #536 against #535: the lanes' pytest
            # step went 31/28/26 s serial to 27/28/26 s with `-n auto`, and
            # with six shards each worker would pay a database create, a
            # migration and an interpreter start for a couple of hundred
            # tests. xdist earns its keep locally, where it runs the whole
            # suite (`make test-par`, 70.6 s to 35.1 s), not a sixth of it.
            shard-*) args+=(-m 'not corpus' --shard-count="$TEST_SHARDS" --shard-index="${TEST_LANE#shard-}") ;;
            *) echo "Unknown test lane: $TEST_LANE"; exit 1 ;;
          esac
          if [ "$TEST_LANE" = profile ]; then
            python -m cProfile -o results/profile.pstats -m pytest "${args[@]}"
          else
            python -m pytest "${args[@]}"
          fi
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: timings-${{ inputs.lane }}-${{ inputs.repetition }}
          path: results/
          if-no-files-found: error
