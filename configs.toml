#
# Each [configs.<name>] maps a config to the sheet it writes to and the source
# it pulls from (a listings.json URL or an Airtable shared-view link). Run one
# with:
#
#   python -m trackers.run_tracker <name>
#
# [groups] are named lists of configs run sequentially:
#
#   python -m trackers.run_tracker <group>

