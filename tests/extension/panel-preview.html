<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Software Engineer · Example Company</title><link rel="stylesheet" href="../../extension/public/panel.css"><style>body{margin:0;background:#f4f2f0;font:16px system-ui;color:#1f1e1c}main{max-width:540px;margin:60px 420px 60px 60px;padding:32px;background:white;border:1px solid #e7e5e2}label{display:block;margin:20px 0}input,textarea{display:block;padding:12px;border:1px solid #d6d4d1;border-radius:4px;width:90%}h1{font-weight:400}@media(max-width:700px){main{margin:24px;padding:20px}}</style></head><body><main><form id="demo-form"><small>EXAMPLE COMPANY</small><h1>Software Engineer</h1><p>Application preview with fictional data.</p><label>Full name<input id="name"></label><label>Email address<input id="email"></label><label>LinkedIn profile<input id="linkedin"></label><label>Why are you interested?<textarea id="interest"></textarea></label><label>Portfolio URL<input id="portfolio"></label><label>Resume<input id="resume" type="file"></label><button id="demo-submit" type="submit">Submit demo application</button></form></main><script type="module">
import { startApplication, Operation, SubmissionStore } from '../../extension/.output/preview.js';
const mode=new URLSearchParams(location.search).get('state');
let resolveRequests=0;
const entries=[{key:'name',label:'Full name',kind:'text',rung:'profile',value:'Alex Morgan'},{key:'email',label:'Email address',kind:'text',rung:'profile',value:'alex@example.com'},{key:'linkedin',label:'LinkedIn profile',kind:'text',rung:'bank',value:'https://www.linkedin.com/in/example'},{key:'interest',label:'Why are you interested in joining our team?',kind:'long',rung:'draft',value:'I enjoy building reliable tools that make everyday work easier. This role brings together product engineering and the chance to learn from a collaborative team.'},{key:'portfolio',label:'Portfolio URL',kind:'text',value:null},{key:'resume',label:'Resume / CV',kind:'file',value:null}];
let savedFields=structuredClone(entries);
if(new URLSearchParams(location.search).has('reset'))sessionStorage.clear();
const memory={get:async key=>({[key]:JSON.parse(sessionStorage.getItem(key)||'null')}),set:async values=>{for(const [k,v]of Object.entries(values))sessionStorage.setItem(k,JSON.stringify(v));},remove:async key=>sessionStorage.removeItem(key)};
const request=async msg=>{
 if(msg.kind==='policy'){
  const on={allowed:true,reason:null};
  if(new URLSearchParams(location.search).get('policy')==='off')return {ok:false,unavailable:true,reason:'NETWORK'};
  return {ok:true,config:{schema_version:1,revision:'preview',adapter:'preview',max_age_seconds:300,features:{autofill:on,ai_suggestions:on,resume_upload:on,auto_advance:on}}};
 }
 if(msg.kind==='recipe')return {ok:false,unavailable:true,reason:'NOT_PUBLISHED'};
 if(msg.path&&msg.path.startsWith('user/apply/context')){
  if(new URLSearchParams(location.search).get('context')==='error')return {ok:false,status:503};
  return {ok:true,json:{
   job:mode==='empty'?null:{id:20,company:'Example Company',title:'Software Engineer',...(new URLSearchParams(location.search).has('applied')?{status:'Application Submitted',date_applied:'2026-09-01',submitted_at:'2026-09-01T12:00:00Z'}:{})},
   profile:{first_name:'Alex',last_name:'Morgan',email:'alex@example.com',phone:'+1 555 0100',city:'Jersey City',state:'NJ',linkedin:'https://linkedin.com/in/example',education:[{school:'Example University'},{school:'Another School'}]},
   answers:[{id:1,label:'Are you excited to work in an office?',kind:'yesno',value:'Yes',times_used:3},{id:2,label:'Do you require sponsorship?',kind:'yesno',value:'No',times_used:5}],
   drafts:mode==='empty'?[]:[{key:'q-why',question:'Why are you interested in this role?',draft:'Because the work is close to what I already build.'}],
  }};
 }
 if(msg.path==='user/settings')return {ok:true,json:{prefs:{}}};
 if(msg.path==='user/apply/fills/1/track'){
  document.body.dataset.trackRequests=String(Number(document.body.dataset.trackRequests||0)+1);
  return new URLSearchParams(location.search).has('track-error')?{ok:false,status:503}:{ok:true,json:{job_id:20,url:'https://jobs.example.com/20'}};
 }
 if(msg.path==='user/apply/fills/1'){
  if(new URLSearchParams(location.search).has('review-error'))return {ok:false,status:503};
  return {ok:true,json:{id:1,job_id:20,submitted_at:null,fields:structuredClone(savedFields)}};
 }
 if(msg.path==='user/apply/fills/1/answer'){
  if(new URLSearchParams(location.search).has('save-error'))return {ok:false,status:503};
  const f=savedFields.find(f=>f.key===msg.body.key);
  if((f.answer_revision||0)!==msg.body.revision)return {ok:false,status:409};
  f.answer_revision=(f.answer_revision||0)+1;f.review_value=msg.body.value;f.feedback=msg.body.feedback;
  (f.answer_history ||= []).push({kind:'edit',at:new Date().toISOString(),value:f.review_value,feedback:f.feedback});
  return {ok:true,json:{id:1,job_id:20,submitted_at:null,fields:structuredClone(savedFields)}};
 }
 if(msg.path==='user/apply/resolve'){
  resolveRequests++;
  document.body.dataset.resolveRequests=String(resolveRequests);
  if(mode==='retry'&&resolveRequests===1)return new Promise(()=>{});
  if(mode==='loading')return new Promise(()=>{});
  if(mode==='error')return {ok:false,status:503,error:'Service unavailable'};
  return {ok:true,json:{fill_id:1,job_id:20,fields:mode==='empty'?[]:msg.body.fields.length?entries:[],profile:{}}};
 }
 if(msg.path.endsWith('/submitted'))return new URLSearchParams(location.search).has('fail')?{ok:false,status:503}:{ok:true,json:{job_id:20,fields:[]}};
 if(msg.path==='user/apply/suggest'){
  if(msg.body.review_only){const key=msg.body.fields[0].key;const f=savedFields.find(f=>f.key===key);f.review_value='A revised answer based on my backend project.';f.answer_revision=(f.answer_revision||0)+1;return {ok:true,json:{answers:{[key]:f.review_value},skipped:[],model:'preview'}};}
  return {ok:true,json:{answers:{}}};
 }
 return {ok:true,json:{id:1}};
};
const store=new SubmissionStore(memory,request);
window.chrome={storage:{local:{get:(_keys,cb)=>cb({theme:new URLSearchParams(location.search).get('theme')||'light'}),set:()=>{}}},runtime:{sendMessage:(msg,cb)=>{const pending=msg.kind==='submission'?store.handle(msg,{tab:{id:1},frameId:0,url:location.href}):request(msg); if(cb)pending.then(cb); return pending;},getURL:p=>'../../extension/public/'+p,getManifest:()=>({version:'preview'}),onMessage:{addListener:()=>{}}}};
const operation=new Operation(()=>location.href,()=>{});
const adapter={host:'preview',ready:()=>mode!=='confirmed',read:async()=>mode==='empty'?[]:entries.map(e=>({...e,_el:document.getElementById(e.key)})),fill:async(f,v)=>{await operation.sleep(new URLSearchParams(location.search).has('slow')?500:0);if(f.kind==='file')return false;f._el.value=v;return true;},current:f=>f._el?.value||'',submitButton:()=>document.getElementById('demo-submit'),submitted:()=>mode==='confirmed'};
document.getElementById('demo-form').onsubmit=event=>{event.preventDefault();setTimeout(()=>location.href=location.pathname+'?state=confirmed&fail=1',100);};
if(mode==='confirmed')document.querySelector('main').innerHTML='<h1>Thank you for applying!</h1><p>Your application has been received.</p>';
startApplication(adapter,{operation,profile:{}},{addEventListener:(target,type,callback,options)=>target.addEventListener(type,callback,options),setInterval:(callback,delay)=>setInterval(callback,delay)});
</script></body></html>
