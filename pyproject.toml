    "pyasn1==0.6.4",
    "pyasn1_modules==0.4.2",
    "pydantic==2.13.5",
    "pydantic_core==2.46.5",
    "pyparsing==3.3.2",
    "PySocks==1.7.1",
    "python-dotenv==1.2.3",
    "requests-oauthlib==2.0.0",
    "requests==2.34.2",
    "rsa==4.9.1",
